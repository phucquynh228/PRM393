server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: hrm-manager

  # ============ Microsoft SQL Server ============
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=CafeHRM;encrypt=true;trustServerCertificate=true;
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ============ JPA / Hibernate ============
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  # ============ Jackson ============
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

# ============ JWT Configuration ============
jwt:
  secret: Y2FmZWhybS1zZWNyZXQta2V5LXRoaXMtc2hvdWxkLWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
  expiration-ms: 86400000  # 24 hours

# ============ Logging ============
logging:
  level:
    com.cafehr: DEBUG
    org.hibernate.SQL: DEBUG
