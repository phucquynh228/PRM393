server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: hrm-manager

  # ============ Microsoft SQL Server ============
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=CafeHRM;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # Align existing varchar columns with @Nationalized before JPA reads them.
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/ensure-unicode.sql
        - classpath:db/repair-legacy-seed-names.sql
      encoding: UTF-8

  # ============ JPA / Hibernate ============
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  # ============ Jackson ============
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

# ============ JWT Configuration ============
jwt:
  secret: Y2FmZWhybS1zZWNyZXQta2V5LXRoaXMtc2hvdWxkLWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
  expiration-ms: 86400000  # 24 hours

# Google OAuth Web client ID shared with the Android app's serverClientId.
# Public OAuth identifier for this project; deployments can override it via env.
google:
  auth:
    client-id: ${GOOGLE_WEB_CLIENT_ID:793910679996-kbstvnv0cl5db0hni5jk92rgamrmt1rq.apps.googleusercontent.com}

# ============ Logging ============
logging:
  level:
    com.cafehr: DEBUG
    org.hibernate.SQL: DEBUG
